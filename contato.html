  <header>
    <h1>Contato</h1>
  </header>
  <main>
    <section>
      <h2>Entre em Contato</h2>
      <!-- Formulário funcional usando Formspree -->
      <form action=https://formspree.io/f/xpwrndyj method="POST">
        <label for="nome">Nome:</label><br />
        <input type="text" id="nome" name="name" placeholder="Seu nome" required /><br /><br />

        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required /><br /><br />

        <label for="mensagem">Mensagem:</label><br />
        <textarea id="mensagem" name="message" rows="5" placeholder="Digite sua mensagem" required></textarea
        ><br /><br />

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
